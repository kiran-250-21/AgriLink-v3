services:
  # Backend Web Service (Free Tier)
  - type: web
    name: agrilink-backend
    env: node
    plan: free
    rootDir: fullstack/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://pasupulakiran250_db_user:Mongodb212121@cluster0.j8cfijk.mongodb.net/agrilink?appName=Cluster0
      - key: JWT_SECRET
        value: agrilink_super_secret_jwt_key_2026_sde_startup
      - key: ADMIN_EMAIL
        value: admin@agrilink.com
      - key: ADMIN_PASSWORD
        generateValue: true

  # Frontend Static Site (Always Free)
  - type: web
    name: agrilink-frontend
    env: static
    rootDir: fullstack/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agrilink-backend
          property: host
